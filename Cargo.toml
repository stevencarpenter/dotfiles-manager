[workspace]
resolver = "3"
members = ["crates/model", "crates/engine", "crates/platform_macos", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"

[workspace.dependencies]
dfm-model = { path = "crates/model" }
dfm-platform-macos = { path = "crates/platform_macos" }
dfm-engine = { path = "crates/engine" }
serde = { version = "=1.0.229", features = ["derive"] }
toml = { version = "=1.1.6", default-features = false, features = ["std", "serde", "parse", "display"] }
sha2 = "=0.10.9"
serde_json = "=1.0.149"
# Safe descriptor-relative file operations (openat, mkdirat, renameat, linkat, fstatat). Only the
# fs and std features: no process, net or unsafe-bearing extras. Released 2026-09-16.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
# SIGINT and SIGTERM handlers (sigaction), used only by crates/engine/src/signal.rs. Already in the
# lock file as rustix's dependency, so no new package. No default features (no std wrapper needed).
libc = { version = "=0.2.190", default-features = false }
# Argument parsing (builder API, no derive: no proc-macro crates) and shell completions, used by
# crates/cli only. No color, suggestions or wrapping: usage errors are one plain line (DFM-79).
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
clap_complete = { version = "=4.6.11", default-features = false }

[workspace.lints.rust]
# Not "forbid": forbid cannot be relaxed, and crates/engine/src/signal.rs must. Every other crate
# root says #![forbid(unsafe_code)] itself and a gate test checks it.
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

# Tests hash a ~400 MB toolchain tree; unoptimized sha2 is too slow for that.
[profile.dev.package.sha2]
opt-level = 3

# Tests and the hooks: line tables keep file and line in panics and backtraces at a fraction of
# full debug info, so test binaries link faster and the CI test archive is smaller. Debug
# assertions and overflow checks stay on (the dev defaults). For a debugger session, override it
# with CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

# The shipped binary: an integer overflow panics as in the tested dev build instead of wrapping.
# Unwinding stays (no panic = "abort"): Drop guards remove staging and scratch files on a panic.
# No LTO and no codegen-units = 1: measured 3 times the build time for every install and
# self-update for a 19 to 24 percent smaller binary and no measured run-time gain.
[profile.release]
overflow-checks = true
