pre-commit:
  jobs:
    # The fast steps only (README, "Check the draft").
    - name: local-validation
      run: bash scripts/check_staged.sh fixtures scripts rust-style

pre-push:
  jobs:
    # Owner rules (2026-10-20, 2026-10-25): the tests run locally before any push, on each
    # pushed tip only, in its own temporary tree ({1} is the remote git names).
    - name: tests
      run: bash scripts/check_push.sh {1}
      use_stdin: true
