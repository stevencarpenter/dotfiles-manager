[package]
name = "dfm-cli"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
publish = { workspace = true }

[[bin]]
name = "dotfiles-manager"
path = "src/main.rs"

[features]
# Never in default. Compiles DFM_HOME, DFM_BINDING, DFM_PLATFORM and --home.
test-isolation = []

[dependencies]
dfm-model = { workspace = true }
dfm-platform-macos = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
dfm-cli = { path = ".", features = ["test-isolation"] }

[lints]
workspace = true
