schema = 1
id = "personal-dev"
platforms = ["macos"]
requires = ["agents", "desktop"]

# A declared owner is not permission to replace a different installed owner.
[[resources]]
id = "atuin"
kind = "package"
adapter = "homebrew/v1"
[resources.value]
name = "atuin"
update_policy = "rolling"
downgrade = "forbid"

[[resources]]
id = "firstmate"
kind = "application"
adapter = "firstmate-native/v1"
[resources.value]
name = "firstmate"
update_policy = "native-request"
completion = "receipt"

# This vault/item is deliberately nonexistent. No validation calls 1Password.
[[resources]]
id = "example-secret"
kind = "secret"
adapter = "op-template/v1"
target = ".config/example/personal.env"
[resources.value]
template = "files/personal.env.tpl"
account = "example-account"
mode = 0o600
