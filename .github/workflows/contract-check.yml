name: Contract checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Install the pinned Rust toolchain
        run: |
          pin=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$pin" --profile minimal --component rustfmt --component clippy

      - name: Check design fixtures
        run: bash scripts/check_all.sh fixtures

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Check script style and syntax
        run: bash scripts/check_all.sh scripts

      - name: Check Rust style (fmt, clippy)
        run: bash scripts/check_all.sh rust-style

      - name: Run implementation tests
        run: bash scripts/check_all.sh rust-tests
